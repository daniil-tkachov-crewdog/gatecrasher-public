services:
  # ===== Express API =====
  - type: web
    name: gatecrasher-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm ci --ignore-scripts
    startCommand: node src/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # ---- Public site origin (your prod) ----
      - key: APP_BASE_URL
        value: https://crewdog.app
      - key: APP_ORIGIN
        value: https://crewdog.app

      # ---- Supabase (server-side) ----
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # If you also use anon on client via API templates (not required for server):
      - key: SUPABASE_ANON_KEY
        sync: false

      # ---- Stripe ----
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false

      # ---- n8n ----
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_ENDPOINT
        value: https://crewdog.app.n8n.cloud
      # keep compatibility if your code reads N8N_ENDPOINT_URL
      - key: N8N_ENDPOINT_URL
        value: https://crewdog.app.n8n.cloud

      # ---- Admin / Analytics ----
      - key: ADMIN_API_KEY
        sync: false
      - key: ADMIN_CANCEL_KEY
        sync: false
      - key: GTM_CONTAINER_ID
        sync: false
      - key: GA_MEASUREMENT_ID
        sync: false

  # ===== Static Frontend (CDN) =====
  - type: static
    name: gatecrasher-web
    staticPublishPath: public
    buildCommand: echo "Nothing to build"
    headers:
      # Global CSP for static pages; keep Supabase exact host + wss
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.googletagmanager.com https://www.google-analytics.com https://cdn.jsdelivr.net https://esm.sh;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.googletagmanager.com;
          img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com https://www.gstatic.com;
          font-src 'self' data: https://fonts.gstatic.com;
          frame-src 'self' https://js.stripe.com https://www.googletagmanager.com;
          connect-src 'self' https://lurzlzhpjxcxhuoqpbok.supabase.co wss://lurzlzhpjxcxhuoqpbok.supabase.co https://api.stripe.com https://js.stripe.com https://www.googletagmanager.com https://www.google-analytics.com https://region1.google-analytics.com https://crewdog.app.n8n.cloud;
          form-action 'self' https://crewdog.app.n8n.cloud;
          worker-src 'self' blob:;
          object-src 'none';
          base-uri 'self';
      # Cache policy
      - path: /css/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /js/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: public, max-age=300
