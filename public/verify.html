<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>X-Ray Link — Email Verified</title>
    <style>
      :root {
        --bg: #0b0e11;
        --card: #12161c;
        --text: #e6eaf2;
        --muted: #94a3b8;
        --accent: #3b82f6;
        --border: #1f2937;
        --input: #0f172a;
        --footer: #151a1f;
      }
      html[data-theme="light"] {
        --bg: #ffffff;
        --card: #f7f8fa;
        --text: #0f172a;
        --muted: #475569;
        --accent: #2563eb;
        --border: #e5e7eb;
        --input: #f1f5f9;
        --footer: #f2f2f2;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial;
        background: var(--bg); color: var(--text);
        -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
        display: flex; flex-direction: column; min-height: 100vh;
      }
      .container { max-width: 960px; margin: 0 auto; padding: 16px; flex: 1 0 auto; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
      .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #00c2ff); }
      .brand h1 { font-size: 18px; margin: 0; }
      .toggle { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--card);
        padding: 6px 10px; border-radius: 999px; cursor: pointer; }
      .toggle input { appearance: none; width: 36px; height: 20px; border-radius: 999px; background: var(--border); position: relative; }
      .toggle input:checked { background: var(--accent); }
      .toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 999px; background: #fff; transition: transform .2s ease; }
      .toggle input:checked::after { transform: translateX(16px); }
      .subtitle { font-size: 13px; color: var(--muted); margin: 0; }

      /* Centered card like run.html */
      .center-wrap { display: grid; place-items: center; padding: 32px 0 40px; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 100%; max-width: 560px; text-align: center; }
      .card h2 { margin: 0 0 8px; font-size: 22px; }
      .card p { margin: 0 0 16px; color: var(--muted); font-size: 14px; line-height: 1.6; }

      .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      .button {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        background: var(--card); border: 1px solid var(--border); color: var(--text);
        padding: 10px 14px; border-radius: 10px; cursor: pointer; text-decoration: none;
        min-width: 140px;
      }
      .button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .button.white   { background: #fff; color: #111; border-color: var(--border); }
      html[data-theme="dark"] .button.white { background: #fff; color: #111; }

      /* Footer (same style as updated run.html) */
      .footer {
        flex-shrink: 0;
        width: 100%;
        background: var(--footer);
        padding: 16px 12px 24px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        text-align: center;
        margin: 0;
      }
      .footer-nav { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
      .footer a { color: var(--text); text-decoration: none; font-weight: 600; }
      .footer a:hover, .footer a:focus { text-decoration: underline; }
      .footer-copy { color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand">
          <span class="logo"></span>
          <h1>X-Ray Link</h1>
        </div>
        <label class="toggle" title="Toggle theme">
          <span class="subtitle">Theme</span>
          <input id="themeToggle" type="checkbox" aria-label="Toggle theme" />
        </label>
      </header>

      <main class="center-wrap">
        <section class="card" aria-live="polite">
          <h2>Email confirmed</h2>
          <p>Your sign-in email has been verified. You can continue.</p>
          <div class="row" style="margin-top:10px">
            <a class="button primary" href="./run.html">Go to Run</a>
            <a class="button white"   href="./index.html">Go to Home</a>
          </div>
          <p id="err" style="display:none; margin-top:14px; color:#b91c1c; background:#fee2e2; border:1px solid #fecaca; padding:10px; border-radius:8px; font-size:13px;"></p>
        </section>
      </main>
    </div>

    <footer class="footer">
      <nav class="footer-nav" aria-label="Footer">
        <a href="./Privacy_policy.html">Privacy Policy</a>
        <a href="./Terms_of_use.html">Terms of Use</a>
        <a href="./FAQ.html">FAQ</a>
        <a href="./Support.html">Support</a>
      </nav>
      <div class="footer-copy">© X-Ray Link</div>
    </footer>

    <!-- Supabase -->
    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

      // your project credentials (from previous messages)
      const supabase = createClient(
        'https://lurzlhpjxcxhuoqpbok.supabase.co',
        'sb_publishable_x0hlg96FMQ9arkjGd2F9Pw_yQ-fLI3r'
      );

      // Finish verification using the tokens in the URL:
      (async () => {
        try {
          // v2 helper: reads tokens from URL and creates the session
          const { data, error } = await supabase.auth.getSessionFromUrl({ storeSession: true });
          if (error) throw error;

          // Clean the URL (remove tokens from hash) to keep it neat
          if (window.history.replaceState) {
            const clean = window.location.origin + window.location.pathname;
            window.history.replaceState({}, document.title, clean);
          }
        } catch (e) {
          const box = document.getElementById('err');
          if (box) {
            box.style.display = 'block';
            box.textContent = 'Verification failed: ' + (e?.message || e);
          }
        }
      })();

      // Theme toggle (same behavior as run.html)
      (function() {
        var toggle = document.getElementById("themeToggle");
        var root = document.documentElement;
        var saved = localStorage.getItem("xrl-theme");
        var systemPrefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
        var initialMode = saved || (systemPrefersLight ? "light" : "dark");
        root.setAttribute("data-theme", initialMode);
        if (toggle) toggle.checked = initialMode === "light";
        if (toggle) {
          toggle.addEventListener("change", function() {
            var mode = toggle.checked ? "light" : "dark";
            root.setAttribute("data-theme", mode);
            localStorage.setItem("xrl-theme", mode);
          });
        }
      })();
    </script>
  </body>
</html>
