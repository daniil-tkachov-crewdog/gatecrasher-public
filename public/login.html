<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>X-Ray Link — Login</title>
    <style>
      :root {
        --bg: #0b0e11;
        --card: #12161c;
        --text: #e6eaf2;
        --muted: #94a3b8;
        --accent: #3b82f6;
        --border: #1f2937;
        --input: #0f172a;
      }
      [data-theme="light"] {
        --bg: #ffffff;
        --card: #f7f8fa;
        --text: #0f172a;
        --muted: #475569;
        --accent: #2563eb;
        --border: #e5e7eb;
        --input: #f1f5f9;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial;
        background: var(--bg); color: var(--text);
        -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
      }
      .container { max-width: 960px; margin: 0 auto; padding: 16px; min-height: 100%; display: flex; flex-direction: column; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
      .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #00c2ff); }
      .brand h1 { font-size: 18px; margin: 0; }
      .toggle { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--card);
        padding: 6px 10px; border-radius: 999px; cursor: pointer; }
      .toggle input { appearance: none; width: 36px; height: 20px; border-radius: 999px; background: var(--border); position: relative; }
      .toggle input:checked { background: var(--accent); }
      .toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 999px; background: #fff; transition: transform .2s ease; }
      .toggle input:checked::after { transform: translateX(16px); }
      .subtitle { font-size: 13px; color: var(--muted); margin: 0; }

      .center-wrap { flex: 1 1 auto; display: grid; place-items: center; padding: 16px 0 32px; }
      .auth-card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
      .auth-card h2 { margin: 0 0 8px; font-size: 22px; }
      .auth-card p { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.5; }

      label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
      input[type="email"], input[type="password"] {
        width: 100%; background: var(--input); color: var(--text); border: 1px solid var(--border);
        padding: 10px 12px; border-radius: 10px; outline: none;
      }
      .field { margin-bottom: 12px; }
      .button {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        background: var(--card); border: 1px solid var(--border); color: var(--text);
        padding: 10px 14px; border-radius: 10px; cursor: pointer; text-decoration: none;
      }
      .button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      .muted { color: var(--muted); font-size: 13px; }
      .error { color: #b91c1c; background: #fee2e2; border: 1px solid #fecaca; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 10px; display:none; }
      .ok { color: #065f46; background: #d1fae5; border: 1px solid #a7f3d0; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 10px; display:none; }

      .footer { margin: 26px 0 40px; font-size: 12px; color: var(--muted); text-align: center; }

      @supports (-webkit-touch-callout: none) { .button, input { font-size: 16px; } }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand">
          <span class="logo"></span>
          <h1>X-Ray Link</h1>
        </div>
        <label class="toggle" title="Toggle theme">
          <span class="subtitle">Theme</span>
          <input id="themeToggle" type="checkbox" aria-label="Toggle theme" />
        </label>
      </header>

      <main class="center-wrap">
        <section class="auth-card" aria-live="polite">
          <!-- LOGIN VIEW -->
          <div id="view-login">
            <h2>Login</h2>
            <p>Enter your email and password to continue.</p>
            <div id="login-error" class="error"></div>
            <form id="form-login" novalidate>
              <div class="field">
                <label for="login-email">Email</label>
                <input id="login-email" type="email" autocomplete="email" required placeholder="you@example.com" />
              </div>
              <div class="field">
                <label for="login-pass">Password</label>
                <input id="login-pass" type="password" autocomplete="current-password" required placeholder="••••••••" />
              </div>
              <div class="row">
                <button class="button primary" type="submit" id="login-btn">Login</button>
                <a class="button" href="./index.html">Back Home</a>
              </div>
            </form>
            <p class="muted" style="margin-top:12px">
              New here?
              <button id="to-register" class="button" style="padding:6px 10px" type="button">Register now</button>
            </p>
          </div>

          <!-- REGISTER VIEW -->
          <div id="view-register" style="display:none">
            <h2>Create account</h2>
            <p>Register with your email and a password.</p>
            <div id="reg-error" class="error"></div>
            <div id="reg-ok" class="ok"></div>
            <form id="form-register" novalidate>
              <div class="field">
                <label for="reg-email">Email</label>
                <input id="reg-email" type="email" autocomplete="email" required placeholder="you@example.com" />
              </div>
              <div class="field">
                <label for="reg-pass">Password</label>
                <input id="reg-pass" type="password" autocomplete="new-password" required placeholder="••••••••" />
              </div>
              <div class="field">
                <label for="reg-pass2">Confirm password</label>
                <input id="reg-pass2" type="password" autocomplete="new-password" required placeholder="••••••••" />
              </div>
              <div class="row">
                <button class="button primary" type="submit" id="reg-btn">Register</button>
                <button class="button" type="button" id="to-login">Back to login</button>
              </div>
            </form>
          </div>
        </section>
      </main>

      <footer class="footer">© X-Ray Link</footer>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // Theme toggle (unchanged)
      (function() {
        const toggle = document.getElementById("themeToggle");
        const root = document.documentElement;
        const saved = localStorage.getItem("xrl-theme");
        if (saved) {
          root.setAttribute("data-theme", saved);
          toggle.checked = saved === "light";
        }
        if (toggle) {
          toggle.addEventListener("change", function() {
            const mode = toggle.checked ? "light" : "dark";
            root.setAttribute("data-theme", mode);
            localStorage.setItem("xrl-theme", mode);
          });
        }
      })();

      // Views (unchanged)
      (function() {
        const vLogin = document.getElementById("view-login");
        const vReg   = document.getElementById("view-register");
        const toReg  = document.getElementById("to-register");
        const toLog  = document.getElementById("to-login");
        if (toReg) toReg.addEventListener("click", () => { vLogin.style.display="none"; vReg.style.display="block"; });
        if (toLog) toLog.addEventListener("click", () => { vReg.style.display="none"; vLogin.style.display="block"; });
      })();

      // === Supabase client ===
      const supabase = window.supabase.createClient(
        "https://lurzlzhpjxcxhuoqpbok.supabase.co", // Updated to match your provided URL
        "sb_publishable_x0hlg96FMQ9arkjGd2F9Pw_yQ-fLI3r" // Verify this anon key matches the new project
      );

      // Helpers (unchanged)
      function show(el, msg){ if(!el) return; el.textContent = msg||""; el.style.display = msg ? "block" : "none"; }
      function disable(btn, on){ if(!btn) return; btn.disabled = !!on; }
      function validEmail(s){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s||"").trim()); }

      // LOGIN
      (function () {
        const form = document.getElementById("form-login");
        const btn  = document.getElementById("login-btn");
        const err  = document.getElementById("login-error");

        if (!form) return;
        form.addEventListener("submit", async (ev) => {
          ev.preventDefault();
          show(err, "");
          const email = document.getElementById("login-email").value.trim();
          const password = document.getElementById("login-pass").value;

          if (!validEmail(email)) return show(err, "Enter a valid email.");
          if (!password || password.length < 6) return show(err, "Password must be at least 6 characters.");

          disable(btn, true);
          try {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            disable(btn, false);

            if (error) {
              console.log("Login error details:", error);
              return show(err, "Invalid email or password");
            }
            window.location.href = "./run.html";
          } catch (e) {
            disable(btn, false);
            console.error("Login network error:", e);
            show(err, "Failed to connect to server. Check your internet or try again later.");
          }
        });
      })();

      // REGISTER
      (function () {
        const form = document.getElementById("form-register");
        const btn  = document.getElementById("reg-btn");
        const err  = document.getElementById("reg-error");
        const ok   = document.getElementById("reg-ok");

        if (!form) return;
        form.addEventListener("submit", async (ev) => {
          ev.preventDefault();
          show(err, ""); show(ok, "");
          const email = document.getElementById("reg-email").value.trim();
          const pass1 = document.getElementById("reg-pass").value;
          const pass2 = document.getElementById("reg-pass2").value;

          if (!validEmail(email)) return show(err, "Enter a valid email.");
          if (!pass1 || pass1.length < 6) return show(err, "Password must be at least 6 characters.");
          if (pass1 !== pass2) return show(err, "Passwords do not match.");

          disable(btn, true);
          try {
            const { data, error } = await supabase.auth.signUp({ email, password: pass1 });
            disable(btn, false);

            if (error) {
              console.log("Registration error details:", error);
              return show(err, /already/i.test(error.message) ? "Email already in use" : "Registration failed: " + error.message);
            }

            // Attempt auto-login
            const { loginData, loginError } = await supabase.auth.signInWithPassword({ email, password: pass1 });
            if (loginError) {
              console.log("Auto-login error details:", loginError);
              show(ok, "Registration successful, but auto-login failed. Please log in manually.");
              document.getElementById("view-register").style.display = "none";
              document.getElementById("view-login").style.display = "block";
              return;
            }

            show(ok, "Registration successful! Redirecting...");
            setTimeout(() => window.location.href = "./run.html", 2000);
          } catch (e) {
            disable(btn, false);
            console.error("Registration network error:", e);
            show(err, "Failed to connect to server. Check your internet or try again later.");
          }
        });
      })();
    </script>
  </body>
</html>
