<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>X-Ray Link — Login</title>
    <style>
      :root {
        --bg: #0b0e11;
        --card: #12161c;
        --text: #e6eaf2;
        --muted: #94a3b8;
        --accent: #3b82f6;
        --border: #1f2937;
        --input: #0f172a;
      }
      [data-theme="light"] {
        --bg: #ffffff;
        --card: #f7f8fa;
        --text: #0f172a;
        --muted: #475569;
        --accent: #2563eb;
        --border: #e5e7eb;
        --input: #f1f5f9;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial;
        background: var(--bg); color: var(--text);
        -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
      }
      .container { max-width: 960px; margin: 0 auto; padding: 16px; min-height: 100%; display: flex; flex-direction: column; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
      .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #00c2ff); }
      .brand h1 { font-size: 18px; margin: 0; }
      .toggle { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--card);
        padding: 6px 10px; border-radius: 999px; cursor: pointer; }
      .toggle input { appearance: none; width: 36px; height: 20px; border-radius: 999px; background: var(--border); position: relative; }
      .toggle input:checked { background: var(--accent); }
      .toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 999px; background: #fff; transition: transform .2s ease; }
      .toggle input:checked::after { transform: translateX(16px); }
      .subtitle { font-size: 13px; color: var(--muted); margin: 0; }

      /* Centered auth block */
      .center-wrap { flex: 1 1 auto; display: grid; place-items: center; padding: 16px 0 32px; }
      .auth-card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
      .auth-card h2 { margin: 0 0 8px; font-size: 22px; }
      .auth-card p { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.5; }

      label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
      input[type="email"], input[type="password"] {
        width: 100%; background: var(--input); color: var(--text); border: 1px solid var(--border);
        padding: 10px 12px; border-radius: 10px; outline: none;
      }
      .field { margin-bottom: 12px; }
      .button {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        background: var(--card); border: 1px solid var(--border); color: var(--text);
        padding: 10px 14px; border-radius: 10px; cursor: pointer; text-decoration: none;
      }
      .button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      .muted { color: var(--muted); font-size: 13px; }
      .error { color: #b91c1c; background: #fee2e2; border: 1px solid #fecaca; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 10px; display:none; }

      .footer { margin: 26px 0 40px; font-size: 12px; color: var(--muted); text-align: center; }

      @supports (-webkit-touch-callout: none) { .button, input { font-size: 16px; } }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Top bar -->
      <header class="topbar">
        <div class="brand">
          <span class="logo"></span>
          <h1>X-Ray Link</h1>
        </div>
        <label class="toggle" title="Toggle theme">
          <span class="subtitle">Theme</span>
          <input id="themeToggle" type="checkbox" aria-label="Toggle theme" />
        </label>
      </header>

      <!-- Centered login/registration -->
      <main class="center-wrap">
        <section class="auth-card" aria-live="polite">
          <!-- LOGIN VIEW -->
          <div id="view-login">
            <h2>Login</h2>
            <p>Enter your email and password to continue.</p>
            <div id="login-error" class="error"></div>
            <form id="form-login" novalidate>
              <div class="field">
                <label for="login-email">Email</label>
                <input id="login-email" type="email" autocomplete="email" required placeholder="you@example.com" />
              </div>
              <div class="field">
                <label for="login-pass">Password</label>
                <input id="login-pass" type="password" autocomplete="current-password" required placeholder="••••••••" />
              </div>
              <div class="row">
                <button class="button primary" type="submit" id="login-btn">Login</button>
                <a class="button" href="./index.webhook.html">Back to Run</a>
              </div>
            </form>
            <p class="muted" style="margin-top:12px">
              New here?
              <button id="to-register" class="button" style="padding:6px 10px">Register now</button>
            </p>
          </div>

          <!-- REGISTER VIEW -->
          <div id="view-register" style="display:none">
            <h2>Create account</h2>
            <p>Register with your email and a password.</p>
            <div id="reg-error" class="error"></div>
            <form id="form-register" novalidate>
              <div class="field">
                <label for="reg-email">Email</label>
                <input id="reg-email" type="email" autocomplete="email" required placeholder="you@example.com" />
              </div>
              <div class="field">
                <label for="reg-pass">Password</label>
                <input id="reg-pass" type="password" autocomplete="new-password" required placeholder="••••••••" />
              </div>
              <div class="field">
                <label for="reg-pass2">Confirm password</label>
                <input id="reg-pass2" type="password" autocomplete="new-password" required placeholder="••••••••" />
              </div>
              <div class="row">
                <button class="button primary" type="submit" id="reg-btn">Register</button>
                <button class="button" type="button" id="to-login">Back to login</button>
              </div>
            </form>
          </div>
        </section>
      </main>

      <footer class="footer">© X-Ray Link</footer>
    </div>

    <script>
      // Theme toggle (match existing pages) — uses localStorage "xrl-theme".
      (function() {
        var toggle = document.getElementById("themeToggle");
        var root = document.documentElement;
        var saved = localStorage.getItem("xrl-theme");
        if (saved) {
          root.setAttribute("data-theme", saved);
          toggle.checked = saved === "light";
        }
        if (toggle) {
          toggle.addEventListener("change", function() {
            var mode = toggle.checked ? "light" : "dark";
            root.setAttribute("data-theme", mode);
            localStorage.setItem("xrl-theme", mode);
          });
        }
      })();

      // View switching: Login <-> Register
      (function() {
        var vLogin = document.getElementById("view-login");
        var vReg   = document.getElementById("view-register");
        var toReg  = document.getElementById("to-register");
        var toLog  = document.getElementById("to-login");

        if (toReg) toReg.addEventListener("click", function(){ vLogin.style.display="none"; vReg.style.display="block"; });
        if (toLog) toLog.addEventListener("click",  function(){ vReg.style.display="none"; vLogin.style.display="block"; });
      })();

      // Front-end logic only (no backend yet):
      // - Validate inputs
      // - On success, you can set a client token/email to localStorage and redirect to Run page.
      (function() {
        var loginForm = document.getElementById("form-login");
        var regForm   = document.getElementById("form-register");
        var loginErr  = document.getElementById("login-error");
        var regErr    = document.getElementById("reg-error");

        // Helpers
        function showErr(el, msg){ if(!el) return; el.textContent = msg || ""; el.style.display = msg ? "block" : "none"; }
        function validEmail(s){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s||"").trim()); }

        // LOGIN submit (stub)
        if (loginForm) loginForm.addEventListener("submit", function(ev){
          ev.preventDefault();
          showErr(loginErr, "");
          var email = document.getElementById("login-email").value.trim();
          var pass  = document.getElementById("login-pass").value;

          if (!validEmail(email)) { showErr(loginErr, "Enter a valid email."); return; }
          if (!pass || pass.length < 6) { showErr(loginErr, "Password must be at least 6 characters."); return; }

          // TODO: Replace this block by real backend auth.
          // Simulate success:
          localStorage.setItem("xrl_email", email);
          // When backend is ready, set the access key/token you validate in n8n:
          // localStorage.setItem("xrl_key", "<server-issued-token>");
          // localStorage.setItem("xrl_key_ts", Date.now().toString());

          location.href = "./index.webhook.html"; // go to Run page
        });

        // REGISTER submit (stub)
        if (regForm) regForm.addEventListener("submit", function(ev){
          ev.preventDefault();
          showErr(regErr, "");
          var email = document.getElementById("reg-email").value.trim();
          var pass1 = document.getElementById("reg-pass").value;
          var pass2 = document.getElementById("reg-pass2").value;

          if (!validEmail(email)) { showErr(regErr, "Enter a valid email."); return; }
          if (!pass1 || pass1.length < 6) { showErr(regErr, "Password must be at least 6 characters."); return; }
          if (pass1 !== pass2) { showErr(regErr, "Passwords do not match."); return; }

          // TODO: Replace with backend registration call + server-issued token.
          // Simulate success:
          localStorage.setItem("xrl_email", email);
          // localStorage.setItem("xrl_key", "<server-issued-token>");
          // localStorage.setItem("xrl_key_ts", Date.now().toString());

          location.href = "./index.webhook.html";
        });
      })();
    </script>

    </script>
  </body>
</html>
