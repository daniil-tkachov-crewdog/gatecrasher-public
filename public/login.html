<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <!-- Consent banner + GTM/GA handling (loads GTM only after user accepts) -->
    <script defer src="/js/consent.js"></script>

    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>X-Ray Link — Login</title>

    <script src="/js/theme-boot.js"></script>
    <link rel="stylesheet" href="/css/theme-boot.css" />

    <link rel="stylesheet" href="/css/login.css" />
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand">
          <span class="logo"></span>
          <h1>Crewdog.demo</h1>
        </div>
        <label class="toggle" title="Toggle theme">
          <span class="subtitle">Theme</span>
          <input id="themeToggle" type="checkbox" aria-label="Toggle theme" />
        </label>
      </header>

      <main class="center-wrap">
        <section class="auth-card" aria-live="polite">
          <!-- LOGIN VIEW -->
          <div id="view-login">
            <h2>Login</h2>
            <p>Enter your email and password to continue.</p>
            <div id="login-error" class="error"></div>
            <form id="form-login" novalidate>
              <div class="field">
                <label for="login-email">Email</label>
                <input
                  id="login-email"
                  type="email"
                  autocomplete="email"
                  required
                  placeholder="you@example.com"
                />
              </div>
              <div class="field">
                <label for="login-pass">Password</label>
                <input
                  id="login-pass"
                  type="password"
                  autocomplete="current-password"
                  required
                  placeholder="••••••••"
                />
              </div>
              <div class="field">
                <button type="button" id="google-btn" class="button">
                  Continue with Google
                </button>
              </div>
              <div class="row">
                <button class="button primary" type="submit" id="login-btn">
                  Login
                </button>
                <a class="button" href="./index.html">Back Home</a>
              </div>
            </form>
            <p class="muted" style="margin-top: 12px">
              New here?
              <button
                id="to-register"
                class="button"
                style="padding: 6px 10px"
                type="button"
              >
                Register now
              </button>
            </p>
          </div>

          <!-- REGISTER VIEW -->
          <div id="view-register" style="display: none">
            <h2>Create account</h2>
            <p>Register with your email and a password.</p>
            <div id="reg-error" class="error"></div>
            <div id="reg-ok" class="ok"></div>
            <form id="form-register" novalidate>
              <div class="field">
                <label for="reg-email">Email</label>
                <input
                  id="reg-email"
                  type="email"
                  autocomplete="email"
                  required
                  placeholder="you@example.com"
                />
              </div>
              <div class="field">
                <label for="reg-pass">Password</label>
                <input
                  id="reg-pass"
                  type="password"
                  autocomplete="new-password"
                  required
                  placeholder="••••••••"
                />
              </div>
              <div class="field">
                <label for="reg-pass2">Confirm password</label>
                <input
                  id="reg-pass2"
                  type="password"
                  autocomplete="new-password"
                  required
                  placeholder="••••••••"
                />
              </div>
              <div class="row">
                <button class="button primary" type="submit" id="reg-btn">
                  Register
                </button>
                <button class="button" type="button" id="to-login">
                  Back to login
                </button>
              </div>
            </form>
          </div>
        </section>
      </main>

      <footer class="footer">© Crewdog</footer>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Entry point (ESM) -->
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
