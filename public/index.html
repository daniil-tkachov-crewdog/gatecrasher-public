<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>X-Ray Link</title>
    <style>
      :root {
        --bg: #0b0e11;
        --card: #12161c;
        --text: #e6eaf2;
        --muted: #94a3b8;
        --accent: #3b82f6;
        --border: #1f2937;
        --input: #0f172a;
      }
      [data-theme="light"] {
        --bg: #ffffff;
        --card: #f7f8fa;
        --text: #0f172a;
        --muted: #475569;
        --accent: #2563eb;
        --border: #e2e8f0;
        --input: #f1f5f9;
      }
      html, body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }
      .page {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      header, footer {
        padding: 16px;
      }
      .container {
        max-width: 880px;
        margin: 0 auto;
        padding: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
      }
      .title {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 12px 0;
      }
      .label {
        display: block;
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      textarea {
        width: 100%;
        min-height: 220px;
        resize: vertical;
        background: var(--input);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 14px;
        outline: none;
      }
      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(59,130,246,0.25);
      }

      /* Centering zone for the button ONLY (keeps overall spacing elsewhere intact) */
      .actions-wrap {
        min-height: 220px; /* preserves overall spacing feel even after field removal */
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 240px;                 /* fixed width as requested */
        max-width: 90vw;              /* mobile safety */
        height: 46px;
        padding: 0 18px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--accent);
        color: white;
        font-weight: 700;
        font-size: 15px;
        text-decoration: none;
        cursor: pointer;
        transition: transform .06s ease-in-out, filter .15s ease-in-out;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .btn:hover { filter: brightness(1.05); }
      .btn:active { transform: translateY(1px); }
      .help {
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 640px) {
        .card { padding: 16px; }
        .actions-wrap { min-height: 180px; }
        textarea { min-height: 200px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div class="container">
          <div class="title">X-Ray Link</div>
        </div>
      </header>

      <main>
        <div class="container">
          <div class="card">
            <form action="https://crewdog.app.n8n.cloud/webhook/gatecrasher" method="post" autocomplete="on">
              <!-- Only required field kept -->
              <label for="JD" class="label">Job Description</label>
              <textarea id="JD" name="JD" placeholder="Paste the full job description here..."></textarea>

              <!-- Centered button block -->
              <div class="actions-wrap">
                <button type="submit" class="btn">Run Search</button>
              </div>

              <div class="help">Posts to your existing n8n webhook. No other fields included.</div>
            </form>
          </div>
        </div>
      </main>

      <footer>
        <div class="container">
          <div class="help">© 2025</div>
        </div>
      </footer>
    </div>
  </body>
</html>
