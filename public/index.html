<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gatecraher</title>
  <style>
    :root { --bg: #0b0b0b; --fg: #e6e6e6; --muted:#9aa0a6; --card:#151515; --accent:#5eead4; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell; background: var(--bg); color: var(--fg); }
    .wrap { max-width: 900px; margin: 40px auto; padding: 0 16px; }
    header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 24px; }
    .brand { font-weight: 700; letter-spacing: .5px; }
    .tag { font-size:12px; color: var(--muted); }
    .card { background: var(--card); border-radius: 14px; padding: 18px; box-shadow: 0 0 0 1px #222; }
    label { display:block; font-size: 14px; margin: 12px 0 6px; color: var(--muted); }
    textarea, select { width: 100%; background: #0f0f0f; color: var(--fg); border: 1px solid #2a2a2a; border-radius: 10px; padding: 10px 12px; }
    textarea { min-height: 160px; resize: vertical; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { margin-top: 14px; width: 100%; padding: 12px 14px; border-radius: 12px; border: 0; background: var(--fg); color: #000; font-weight: 700; cursor: pointer; }
    button[disabled] { opacity: .45; cursor: not-allowed; }
    .out { margin-top: 24px; }
    .error { white-space: pre-wrap; color: #ff9aa2; background:#300; border:1px solid #600; padding:12px; border-radius:12px; }
    .success { background:#0f172a; border:1px solid #1f2937; border-radius:12px; padding:16px; }
    .hint { font-size:12px; color:var(--muted); margin-top:6px }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="brand">GATECRAHER</div>
        <div class="tag">Reveal decision-makers • Find candidates</div>
      </div>
    </header>

    <form id="gatecraher-form" class="card" autocomplete="off">
      <label for="JD">JD</label>
      <textarea id="JD" name="JD" required placeholder="Paste the full job description…"></textarea>

      <div class="row">
        <div>
          <label for="Region to search (Candidates)">Region to search (Candidates)</label>
          <select id="Region to search (Candidates)" name="Region to search (Candidates)">
            <option>Asia (India)</option>
            <option>Eastern Europe</option>
            <option>Western Europe</option>
            <option>America</option>
            <option>Africa</option>
            <option>Australia</option>
          </select>
        </div>
        <div>
          <label>Save to the doc file and the spreadsheet? (+10 sec)</label>
          <!-- Required by your workflow. We always send "No" per your instruction. Hidden to users. -->
          <select id="saveToggle" name="Save to the doc file and the spreadsheet? (+10 sec)" style="opacity:.5">
            <option selected>No</option>
            <option>Yes</option>
          </select>
          <div class="hint">Ignored in backend; always sent as <b>No</b>.</div>
        </div>
      </div>

      <button id="submitBtn" type="submit">Run Gatecraher</button>
      <div class="hint">Output mirrors your n8n template (5 HR links, 6 candidate links).</div>
    </form>

    <div id="output" class="out"></div>
  </div>

  <script>
    const form = document.getElementById('gatecraher-form');
    const out = document.getElementById('output');
    const btn = document.getElementById('submitBtn');

    async function callApi(payload){
      const res = await fetch('https://gatecrasher-public.onrender.com/webhook/gatecrasher', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const text = await res.text();
      return { ok: res.ok, status: res.status, body: text };
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      out.innerHTML = '';
      btn.disabled = true; btn.textContent = 'Running…';

      const payload = {
        JD: document.getElementById('JD').value.trim(),
        'Region to search (Candidates)': document.getElementById('Region to search (Candidates)').value,
        'Save to the doc file and the spreadsheet? (+10 sec)': 'No'
      };

      try {
        const { ok, status, body } = await callApi(payload);
        if (!ok) {
          try { const j = JSON.parse(body); throw new Error(j.error || JSON.stringify(j)); } catch(_) { throw new Error(body || ('HTTP ' + status)); }
        }
        out.innerHTML = `<div class="success">${body}</div>`;
      } catch (err) {
        out.innerHTML = `<div class="error">${err.message}</div>`;
      } finally {
        btn.disabled = false; btn.textContent = 'Run Gatecraher';
      }
    });
  </script>
</body>
</html>
