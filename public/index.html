<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>X-Ray Link</title>
    <style>
      :root {
        --bg: #0b0e11;
        --card: #12161c;
        --text: #e6eaf2;
        --muted: #94a3b8;
        --accent: #3b82f6;
        --border: #1f2937;
        --input: #0f172a;
      }
      [data-theme="light"] {
        --bg: #ffffff;
        --card: #f7f8fa;
        --text: #0f172a;
        --muted: #475569;
        --accent: #2563eb;
        --border: #e5e7eb;
        --input: #f1f5f9;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial;
        background: var(--bg); color: var(--text);
        -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
      }
      .container { max-width: 960px; margin: 0 auto; padding: 16px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
      .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #00c2ff); }
      .brand h1 { font-size: 18px; margin: 0; }
      .toggle { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--card);
        padding: 6px 10px; border-radius: 999px; cursor: pointer; }
      .toggle input { appearance: none; width: 36px; height: 20px; border-radius: 999px; background: var(--border); position: relative; }
      .toggle input:checked { background: var(--accent); }
      .toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 999px; background: #fff; transition: transform .2s ease; }
      .toggle input:checked::after { transform: translateX(16px); }
      .subtitle { font-size: 13px; color: var(--muted); margin: 0; }

      .grid { display: grid; gap: 16px; }
      .row-3 { grid-template-columns: 1fr 1fr 1fr; display: grid; gap: 16px; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
      .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }

      h2 { font-size: 16px; margin: 0 0 10px; }
      label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      .label-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .label-row .right { font-size: 12px; color: var(--muted); }

      input[type="text"], input[type="file"], textarea, select {
        width: 100%; background: var(--input); color: var(--text);
        border: 1px solid var(--border); padding: 10px 12px; border-radius: 10px; outline: none;
      }
      textarea { min-height: 180px; resize: vertical; }
      .btn-row { display: flex; gap: 10px; }
      button, .button {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        background: var(--card); border: 1px solid var(--border); color: var(--text);
        padding: 10px 14px; border-radius: 10px; cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: .7; cursor: not-allowed; }

      .result { margin-top: 16px; }
      .footer { margin: 20px 0 40px; font-size: 12px; color: var(--muted); text-align: center; }
      @media (max-width: 840px) { .row-3 { grid-template-columns: 1fr; } .topbar { flex-wrap: wrap; } }

      /* Output styles */
      .gc-header { margin-bottom: 12px; }
      .gc-title { margin: 0; font-size: 24px; font-weight: 700; }
      .gc-sub { margin-top: 6px; font-size: 14px; color: var(--muted); }
      .gc-section { margin-top: 18px; }
      .gc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
      .gc-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--card); }
      .gc-item-title { margin: 0 0 8px; font-weight: 600; }
      .gc-error { background: rgba(244,63,94,.1); border: 1px solid rgba(244,63,94,.3); color: #fecaca; padding: 12px; border-radius: 10px; }

      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div class="brand">
          <div class="logo"></div>
          <h1>X-Ray Link</h1>
        </div>
        <label class="toggle" title="Toggle light/dark">
          <input id="themeToggle" type="checkbox" />
          <span class="subtitle">Light</span>
        </label>
      </div>

      <div class="grid">
        <div class="card">
          <div class="label-row">
            <h2>Paste a job description</h2>
            <span class="right">This tool guesses the end employer and lists HR decision makers.</span>
          </div>
          <textarea id="jd" placeholder="Paste the JD here..."></textarea>

          <div class="label-row" style="margin-top:12px;">
            <label for="wantsLeads" style="margin:0;">Search potential candidates/leads?</label>
            <input id="wantsLeads" type="checkbox" />
          </div>

          <div class="btn-row" style="margin-top:12px;">
            <button id="runBtn" class="primary">Run Search</button>
          </div>

          <div class="result" id="result"></div>
        </div>
      </div>

      <div class="footer">© X-Ray Link</div>
    </div>

    <script>
      (function() {
        // Theme toggle
        const root = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const stored = localStorage.getItem('theme');
        if (stored) root.setAttribute('data-theme', stored);
        themeToggle.checked = stored === 'light';
        themeToggle.addEventListener('change', function(){
          const mode = themeToggle.checked ? 'light' : 'dark';
          root.setAttribute('data-theme', mode);
          localStorage.setItem('theme', mode);
        });

        // Helpers
        function esc(s) {
          return String(s == null ? "" : s)
            .replace(/&/g,"&amp;").replace(/</g,"&lt;")
            .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
        }
        function link(href, text) {
          if (!href) return "";
          return '<a href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+esc(text||href)+'</a>';
        }
        function linkifyText(s) {
          if (!s) return "";
          const urlRe = /(https?:\/\/[^\s<>"]+|www\.[^\s<>"]+)/g;
          // Replace URLs with anchors; keep other text escaped
          let out = "";
          let lastIndex = 0;
          String(s).replace(urlRe, function(m, _1, offset) {
            out += esc(s.slice(lastIndex, offset));
            const href = m.startsWith("http") ? m : ("http://" + m);
            out += '<a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(m) + '</a>';
            lastIndex = offset + m.length;
            return m;
          });
          out += esc(s.slice(lastIndex));
          return out;
        }
        function section(title, inner) {
          if (!inner) return "";
          return '<div class="gc-section"><h2>'+esc(title)+'</h2>'+inner+'</div>';
        }
        function renderCards(arr) {
          if (!Array.isArray(arr) || arr.length === 0) return "";
          const cards = arr.map(function(item) {
            const t = item && item.title ? item.title : "—";
            const lnk = item && item.link ? link(item.link, "LinkedIn") : "";
            return (
              '<div class="gc-card">' +
                '<p class="gc-item-title">' + esc(t) + '</p>' +
                '<p>' + lnk + '</p>' +
              '</div>'
            );
          }).join("");
          return '<div class="gc-grid">' + cards + '</div>';
        }

        // Submit
        const runBtn = document.getElementById('runBtn');
        const result = document.getElementById('result');
        runBtn.addEventListener('click', async function(){
          const btn = runBtn;
          const jd = document.getElementById('jd').value.trim();
          const wantsLeads = document.getElementById('wantsLeads').checked;
          if (!jd) {
            alert('Paste the job description first.');
            return;
          }

          btn.disabled = true; btn.textContent = 'Running...';
          result.innerHTML = '';

          try {
            const payload = {
              body: { JD: jd },
              wants_leads: wantsLeads ? 'yes' : 'no'
            };

            // N8N webhook
            const resp = await fetch('https://crewdog.app.n8n.cloud/webhook/gatecrasher', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const asText = await resp.text();
            let data = null;
            try { data = JSON.parse(asText); } catch(e) {}

            if (data) {
              const lastWantsLeads = wantsLeads;
              const payload = Array.isArray(data) ? data[0] : data;   // supports both outputs
              result.innerHTML = renderTemplate(payload, { wantsLeads: lastWantsLeads });
            } else {
              result.innerHTML = '<div class="panel">' + (asText || "No response") + '</div>';
            }
          } catch (err) {
            result.innerHTML = '<div class="gc-error"><strong>Error:</strong> ' + (err && err.message ? err.message : String(err)) + '</div>';
          } finally {
            if (btn) { btn.disabled = false; btn.textContent = "Run Search"; }
          }
        });

        // ====== RENDERING ======
        function renderTemplate(d, opts) {
          opts = opts || {};
          const wantsLeads = !!opts.wantsLeads;

          const errors = [];
          if (!d || typeof d !== "object") errors.push("Empty or invalid JSON.");
          if (!d || !d.company) errors.push("Missing: company");
          if (!d || !d.company_website) errors.push("Missing: company_website");
          if (!d || !Array.isArray(d.hr)) errors.push("Missing or invalid: hr[]");

          // Leads are OPTIONAL. Do NOT error if missing/empty, regardless of request.
          const hasLeads = Array.isArray(d.potential_leads) && d.potential_leads.length > 0;

          let out = "";
          if (errors.length) {
            out += '<div class="gc-error"><strong>Render error:</strong> ' + errors.join(" · ") + '</div>';
          }

          out += (
            '<div class="gc-header">' +
              '<h1 class="gc-title">' + esc(d.company || "") + '</h1>' +
              '<div class="gc-sub">Website: ' + link(d.company_website, "Link") + '</div>' +
              ((d.sniff_out_clues && String(d.sniff_out_clues).trim()) ? ('<div class="gc-sub">Why this company? ' + linkifyText(d.sniff_out_clues) + '</div>') : '') +
            '</div>'
          );

          out += section("Company HR people", renderCards(d.hr || []));

          // Show Leads section ONLY if leads actually exist (hide when not requested or empty)
          if (hasLeads) {
            out += section("Potential leads", renderCards(d.potential_leads));
          }

          return out;
        }
      })();
    </script>
  </body>
</html>
