<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>X-Ray Link</title>
    <style>
      :root {
        --bg: #0b0e11;
        --card: #12161c;
        --text: #e6eaf2;
        --muted: #94a3b8;
        --accent: #3b82f6;
        --border: #1f2937;
        --input: #0f172a;
      }
      [data-theme="light"] {
        --bg: #ffffff;
        --card: #f7f8fa;
        --text: #0f172a;
        --muted: #475569;
        --accent: #2563eb;
        --border: #e5e7eb;
        --input: #f1f5f9;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial;
        background: var(--bg); color: var(--text);
        -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
      }
      .container { max-width: 960px; margin: 0 auto; padding: 16px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
      .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #00c2ff); }
      .brand h1 { font-size: 18px; margin: 0; }
      .toggle { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--card);
        padding: 6px 10px; border-radius: 999px; cursor: pointer; }
      .toggle input { appearance: none; width: 36px; height: 20px; border-radius: 999px; background: var(--border); position: relative; }
      .toggle input:checked { background: var(--accent); }
      .toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 999px; background: #fff; transition: transform .2s ease; }
      .toggle input:checked::after { transform: translateX(16px); }
      .subtitle { font-size: 13px; color: var(--muted); margin: 0; }

      .grid { display: grid; gap: 16px; }
      .row-3 { grid-template-columns: 1fr 1fr 1fr; display: grid; gap: 16px; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
      .stack { display: grid; gap: 8px; }
      label { font-size: 14px; color: var(--muted); }
      input[type="text"], textarea, select {
        width: 100%; background: var(--input); color: var(--text); border: 1px solid var(--border);
        padding: 10px 12px; border-radius: 10px; outline: none;
      }
      textarea { min-height: 180px; resize: vertical; }
      .btn-row { display: flex; gap: 10px; }
      button, .button {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        background: var(--card); border: 1px solid var(--border); color: var(--text);
        padding: 10px 14px; border-radius: 10px; cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: .7; cursor: not-allowed; }

      .result { margin-top: 16px; }
      .footer { margin: 20px 0 40px; font-size: 12px; color: var(--muted); text-align: center; }
      @media (max-width: 840px) { .row-3 { grid-template-columns: 1fr; } .topbar { flex-wrap: wrap; } }
      @supports (-webkit-touch-callout: none) { select, textarea { font-size: 16px; } }

      .inline-check { display:flex; align-items:center; gap:8px; }
      .inline-check label { margin:0; }
      .muted { color: var(--muted); font-size: 13px; }

      /* ====== RESULT TEMPLATE STYLES ====== */
      .gc-header { margin-bottom: 20px; }
      .gc-title { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
      .gc-sub a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border); }
      .gc-sub.clues { font-style: italic; color: var(--accent); margin-top: 8px; padding-left: 4px; }
      .gc-section { margin: 26px 0 18px; }
      .gc-section h2 { font-size: 18px; margin: 0 0 12px; }
      .gc-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap: 12px; }
      .gc-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
      .gc-card .gc-item-title { font-weight: 600; margin: 0 0 8px; }
      .gc-card a { word-break: break-all; color: var(--accent); }
      .gc-error { color: #b91c1c; background: #fee2e2; border: 1px solid #fecaca; padding: 10px; border-radius: 8px; }
      .panel { background: var(--card); border: 1px dashed var(--border); border-radius: 12px; padding: 12px; overflow-x: auto; }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand">
          <span class="logo"></span>
          <h1>X-Ray Link</h1>
        </div>
        <label class="toggle" title="Toggle theme">
          <span class="subtitle">Theme</span>
          <input id="themeToggle" type="checkbox" aria-label="Toggle theme" />
        </label>
      </header>

      <main class="grid">
        <section class="card">
          <div class="stack">
            <p class="subtitle" style="margin:0">
              Paste a job description, optionally include potential leads, then run.
            </p>

            <form id="gatecrasher-form" method="post" action="https://crewdog.app.n8n.cloud/webhook/gatecrasher" novalidate>
              <div class="row-3">
                <!-- Left: JH checkbox -->
                <div class="stack">
                  <label for="JH_tickbox" class="muted">Options</label>
                  <div class="inline-check">
                    <input id="JH_tickbox" name="JH_tickbox" type="checkbox" value="yes" />
                    <label for="JH_tickbox">Include potential leads search?</label>
                  </div>
                </div>

                <!-- Middle spacer -->
                <div aria-hidden="true"></div>

                <!-- Submit -->
                <div class="stack">
                  <label for="submitBtn" style="visibility:hidden">&nbsp;</label>
                  <button id="submitBtn" class="primary" type="submit">Run Search</button>
                </div>

                <!-- Right spacer -->
                <div aria-hidden="true"></div>
              </div>
              <div class="stack">
                <label for="JD">Job Description (paste below)</label>
                <textarea id="JD" name="JD" placeholder="Paste the full job description here…" required></textarea>
              </div>

              <!-- Ensure "no" is sent when unchecked (overridden to "yes" in JS if checked) -->
              <input type="hidden" name="JH_tickbox" value="no">
            </form>

            <div id="result" class="result"></div>
          </div>
        </section>

        <section class="card">
          <h2 style="margin:0 0 8px">What this tool does</h2>
          <p class="subtitle" style="line-height:1.5">
            Reveals the likely end employer behind an agency job ad, shows HR decision-makers, and optionally finds potential candidates/leads.
          </p>
        </section>
      </main>

      <footer class="footer">© X-Ray Link</footer>
    </div>

    <script>
      // Theme toggle (kept)
      (function() {
        var toggle = document.getElementById("themeToggle");
        var root = document.documentElement;
        var saved = localStorage.getItem("xrl-theme");
        if (saved) {
          root.setAttribute("data-theme", saved);
          toggle.checked = saved === "light";
        }
        if (toggle) {
          toggle.addEventListener("change", function() {
            var mode = toggle.checked ? "light" : "dark";
            root.setAttribute("data-theme", mode);
            localStorage.setItem("xrl-theme", mode);
          });
        }
      })();

      (function() {
        var form = document.getElementById("gatecrasher-form");
        var result = document.getElementById("result");
        if (!form) return;

        var jd = document.getElementById("JD");
        var jhBox = document.getElementById("JH_tickbox");
        var lastWantsLeads = false; // tracks the latest request intent

        form.addEventListener("submit", async function(ev) {
          ev.preventDefault();
          var btn = document.getElementById("submitBtn");
          if (btn) { btn.disabled = true; btn.textContent = "Working…"; }
          try {
            var fd = new FormData(form);

            // Normalize JH value to explicit "yes"/"no"
            lastWantsLeads = !!(jhBox && jhBox.checked);
            fd.set("JH_tickbox", lastWantsLeads ? "yes" : "no");

            // Preserve prior behavior for saver flag
            if (!fd.has("Save to the doc file and the spreadsheet? (+10 sec)")) {
              fd.append("Save to the doc file and the spreadsheet? (+10 sec)", "No");
            }

            /* === API CALL UNCHANGED === */
            const resp = await fetch(form.getAttribute("action"), { method: "POST", body: fd });

            // Expect JSON; fallback to text
            let data, asText = null;
            const ct = (resp.headers.get("content-type") || "").toLowerCase();
            if (ct.includes("application/json")) {
              data = await resp.json();
            } else {
              asText = await resp.text();
              try { data = JSON.parse(asText); } catch (_) {}
            }

            if (data && typeof data === "object") {
              const payload = Array.isArray(data) ? data[0] : data;   // supports both outputs
              result.innerHTML = renderTemplate(payload, { wantsLeads: lastWantsLeads });
            } else {
              result.innerHTML = '<div class="panel">' + (asText || "No response") + '</div>';
            }
          } catch (err) {
            result.innerHTML = '<div class="gc-error"><strong>Error:</strong> ' + (err && err.message ? err.message : String(err)) + '</div>';
          } finally {
            if (btn) { btn.disabled = false; btn.textContent = "Run Search"; }
          }
        });

        // ====== RENDERING ======
        function esc(s) {
          return String(s == null ? "" : s)
            .replace(/&/g,"&amp;").replace(/</g,"&lt;")
            .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
        }
        function link(href, text) {
          if (!href) return "";
          return '<a href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+esc(text||href)+'</a>';
        }
        function section(title, inner) {
          if (!inner) return "";
          return '<div class="gc-section"><h2>'+esc(title)+'</h2>'+inner+'</div>';
        }
        function renderCards(arr) {
          if (!Array.isArray(arr) || arr.length === 0) return "";
          const cards = arr.map(function(item) {
            const t = item && item.title ? item.title : "—";
            const lnk = item && item.link ? link(item.link, "LinkedIn") : "";
            return (
              '<div class="gc-card">' +
                '<p class="gc-item-title">' + esc(t) + '</p>' +
                '<p>' + lnk + '</p>' +
              '</div>'
            );
          }).join("");
          return '<div class="gc-grid">' + cards + '</div>';
        }

        function renderTemplate(d, opts) {
          opts = opts || {};
          const wantsLeads = !!opts.wantsLeads;

          const errors = [];
          if (!d || typeof d !== "object") errors.push("Empty or invalid JSON.");
          if (!d || !d.company) errors.push("Missing: company");
          if (!d || !d.company_website) errors.push("Missing: company_website");
          if (!d || !Array.isArray(d.hr)) errors.push("Missing or invalid: hr[]");

          // Leads are OPTIONAL. Do NOT error if missing/empty, regardless of request.
          const hasLeads = Array.isArray(d.potential_leads) && d.potential_leads.length > 0;

          let out = "";
          if (errors.length) {
            out += '<div class="gc-error"><strong>Render error:</strong> ' + errors.join(" · ") + '</div>';
          }

          out += (
            '<div class="gc-header">' +
              '<h1 class="gc-title">' + esc(d.company || "") + '</h1>' +
              '<div class="gc-sub">Website: ' + link(d.company_website, "Link") + '</div>' +
              ((d.sniff_out_clues && String(d.sniff_out_clues).trim()) ? ('<div class="gc-sub clues">Why this company? ' + esc(String(d.sniff_out_clues)) + '</div>') : '') +
            '</div>'
          );

          out += section("Company HR people", renderCards(d.hr || []));

          // Show Leads section ONLY if leads actually exist (hide when not requested or empty)
          if (hasLeads) {
            out += section("Potential leads", renderCards(d.potential_leads));
          }

          return out;
        }
      })();
    </script>
  </body>
</html>
