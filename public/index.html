<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>X-Ray Link</title>
    <style>
      :root {
        --bg: #0b0e11;
        --card: #12161c;
        --text: #e6eaf2;
        --muted: #94a3b8;
        --accent: #3b82f6;
        --border: #1f2937;
        --input: #0f172a;
      }
      [data-theme="light"] {
        --bg: #ffffff;
        --card: #f7f8fa;
        --text: #0f172a;
        --muted: #475569;
        --accent: #2563eb;
        --border: #e5e7eb;
        --input: #ffffff;
      }
      html, body { height: 100%; }
      body {
        margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial;
        background: var(--bg); color: var(--text);
        -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
      }
      .container { max-width: 960px; margin: 0 auto; padding: 16px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
      .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #00c2ff); }
      .brand h1 { font-size: 18px; margin: 0; }
      .toggle { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--card);
        padding: 6px 10px; border-radius: 999px; cursor: pointer; }
      .toggle input { appearance: none; width: 36px; height: 20px; border-radius: 999px; background: var(--border); position: relative; }
      .toggle input:checked { background: var(--accent); }
      .toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .2s ease; }
      .toggle input:checked::after { left: 18px; }

      .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
      .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
      .stack { display: grid; gap: 10px; }
      label { font-size: 13px; color: var(--muted); }
      select, textarea, button { width: 100%; font: inherit; color: var(--text); }
      select { background: var(--input); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
      textarea { background: var(--input); border: 1px solid var(--border); border-radius: 12px; padding: 12px; min-height: 180px; }
      button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 12px; font-weight: 600; cursor: pointer; }
      .desc { font-size: 14px; color: var(--muted); border-left: 3px solid var(--border); padding: 8px 0 8px 12px; }
      .result { margin-top: 16px; }
      .footer { margin: 20px 0 40px; font-size: 12px; color: var(--muted); text-align: center; }
      @media (max-width: 840px) { .row-3 { grid-template-columns: 1fr; } .topbar { flex-wrap: wrap; } }
      @supports (-webkit-touch-callout: none) { select, textarea { font-size: 16px; } }

      /* ====== RESULT TEMPLATE STYLES ====== */
      .gc-header { margin-bottom: 20px; }
      .gc-title { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
      .gc-sub a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border); }
      .gc-section { margin: 26px 0 18px; }
      .gc-section h2 { font-size: 18px; margin: 0 0 12px; }
      .gc-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap: 12px; }
      .gc-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
      .gc-card .gc-item-title { font-weight: 600; margin: 0 0 8px; }
      .gc-card a { word-break: break-all; color: var(--accent); }
      .gc-error { color: #b91c1c; background: #fee2e2; border: 1px solid #fecaca; padding: 10px; border-radius: 8px; }
      .panel { background: var(--card); border: 1px dashed var(--border); border-radius: 12px; padding: 12px; overflow-x: auto; }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand">
          <span class="logo"></span>
          <h1>X-Ray Link</h1>
        </div>
        <label class="toggle">
          <span>🌙</span>
          <input id="themeToggle" type="checkbox">
          <span>☀️</span>
        </label>
      </header>

      <main class="stack">
        <section class="card stack">
          <p class="desc">
            <strong>Xraylink:</strong> See the Real Employer From job ad to decision-maker in one click.<br>
            <em>Note:</em> The job title alone is not sufficient for this tool to function effectively.
          </p>

          <form id="gatecrasher-form" method="post" action="https://crewdog.app.n8n.cloud/webhook/gatecrasher" novalidate>
            <div class="row-3">
              <!-- Left: Paperclip (CV upload) -->
              <div class="stack">
                <label for="cvBtn" style="visibility:hidden">&nbsp;</label>
                <div class="stack" style="align-items:start;">
                  <button id="cvBtn" type="button" aria-label="Attach CV" title="Attach CV"
                    style="width:auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; cursor: pointer;">
                    📎
                  </button>
                  <input id="cvInput" name="cv_file" type="file" accept=".pdf,.doc,.docx" style="display:none">
                  <div id="cvNote" style="font-size:12px;color:var(--muted);">pdf, doc, docx • ≤10MB</div>
                  <div id="cvFileName" style="font-size:12px;color:var(--muted);"></div>
                  <div id="cvError" class="gc-error" style="display:none;"></div>
                </div>
              </div>

              <!-- Centered Run Search button -->
              <div class="stack">
                <label for="submitBtn" style="visibility:hidden">&nbsp;</label>
                <button id="submitBtn" class="primary" type="submit">Run Search</button>
              </div>

              <!-- Right spacer -->
              <div aria-hidden="true"></div>
            </div>
            <div class="stack">
              <label for="JD">Job Description (paste below)</label>
              <textarea id="JD" name="JD" placeholder="Paste the full job description here…" required></textarea>
            </div>
          </form>

          <div id="result" class="result"></div>
        </section>
        <p class="footer">Results are rendered directly from the n8n workflow response.</p>
      </main>
    </div>

    <script>
      (function() {
        var saved = localStorage.getItem("xrl-theme");
        document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
        var toggle = document.getElementById("themeToggle");
        if (toggle) {
          toggle.checked = document.documentElement.getAttribute("data-theme") === "light";
          toggle.addEventListener("change", function() {
            var mode = toggle.checked ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", mode);
            localStorage.setItem("xrl-theme", mode);
          });
        }
      })();

      (function() {
        var form = document.getElementById("gatecrasher-form");
        var result = document.getElementById("result");
        if (!form) return;

        /* === CV elements & routing === */
        var cvBtn = document.getElementById("cvBtn");
        var cvInput = document.getElementById("cvInput");
        var cvFileName = document.getElementById("cvFileName");
        var cvError = document.getElementById("cvError");
        var jd = document.getElementById("JD");

        var DEFAULT_ACTION = form.getAttribute("action");
        var CV_ACTION = "https://crewdog.app.n8n.cloud/webhook/072d575d-4adc-4f6c-8720-6b25b1040344";

        if (cvBtn && cvInput) {
          cvBtn.addEventListener("click", function() {
            if (cvBtn.disabled) return;
            cvInput.click();
          });

          cvInput.addEventListener("change", function() {
            // reset error
            if (cvError) { cvError.style.display = "none"; cvError.textContent = ""; }

            var f = cvInput.files && cvInput.files[0];
            if (!f) {
              // No file -> enable JD mode
              if (jd) jd.disabled = false;
              if (cvFileName) cvFileName.textContent = "";
              form.setAttribute("action", DEFAULT_ACTION);
              return;
            }

            var sizeOK = f.size <= 10 * 1024 * 1024; // 10MB
            var nameOK = /\.(pdf|docx?)$/i.test(f.name);
            var typeOK = ["application/pdf","application/msword","application/vnd.openxmlformats-officedocument.wordprocessingml.document"].indexOf(f.type) !== -1;

            if (!(sizeOK && (nameOK || typeOK))) {
              if (cvError) {
                cvError.textContent = !sizeOK ? "File too large. Max 10MB." : "Invalid file type. Use PDF, DOC, or DOCX.";
                cvError.style.display = "block";
              }
              cvInput.value = "";
              if (cvFileName) cvFileName.textContent = "";
              if (jd) jd.disabled = false;
              form.setAttribute("action", DEFAULT_ACTION);
              return;
            }

            // Valid CV selected -> CV mode
            if (cvFileName) cvFileName.textContent = "Selected: " + f.name;
            if (jd) { jd.value = ""; jd.disabled = true; }
            form.setAttribute("action", CV_ACTION);
          });

          if (jd) {
            jd.addEventListener("input", function() {
              var hasText = (jd.value || "").trim().length > 0;
              if (hasText) {
                // JD mode -> clear/disable CV
                cvInput.value = "";
                if (cvFileName) cvFileName.textContent = "";
                if (cvError) { cvError.style.display = "none"; cvError.textContent = ""; }
                form.setAttribute("action", DEFAULT_ACTION);
              }
              // Toggle paperclip availability
              cvBtn.disabled = hasText;
            });
          }
        }

        form.addEventListener("submit", async function(ev) {
          ev.preventDefault();
          var btn = document.getElementById("submitBtn");
          if (btn) { btn.disabled = true; btn.textContent = "Working…"; }
          try {
            var isCvMode = !!(cvInput && cvInput.files && cvInput.files.length > 0);

            var fd = new FormData(form);

            // Only add this field for JD mode (not for CV mode where only file must be sent)
            if (!isCvMode && !fd.has("Save to the doc file and the spreadsheet? (+10 sec)")) {
              fd.append("Save to the doc file and the spreadsheet? (+10 sec)", "No");
            }

            /* === API CALL UNCHANGED (method, URL, body) === */
            const resp = await fetch(form.getAttribute("action"), { method: "POST", body: fd });

            // Try JSON first (expected). Fallback to raw text if needed.
            let data, asText = null;
            const ct = (resp.headers.get("content-type") || "").toLowerCase();
            if (ct.includes("application/json")) {
              data = await resp.json();
            } else {
              asText = await resp.text();
              try { data = JSON.parse(asText); } catch (_) {}
            }

            if (data && typeof data === "object") {
              result.innerHTML = renderTemplate(data);
            } else {
              // Fallback: show server text response inside a panel (legacy)
              result.innerHTML = '<div class="panel">' + (asText || "No response") + '</div>';
            }
          } catch (err) {
            result.innerHTML = '<div class="gc-error"><strong>Error:</strong> ' + (err && err.message ? err.message : err) + '</div>';
          } finally {
            if (btn) { btn.disabled = false; btn.textContent = "Run Search"; }
          }
        });

        function esc(v) {
          if (v == null) return "";
          return String(v)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function link(url, text) {
          const u = (url || "").toString().trim();
          if (!u) return "";
          return '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(text || u) + '</a>';
        }

        function section(title, cardsHtml) {
          return '<section class="gc-section"><h2>' + esc(title) + '</h2>' + cardsHtml + '</section>';
        }

        function renderCards(list) {
          if (!Array.isArray(list) || list.length === 0) {
            return '<div class="gc-error">No results found.</div>';
          }
          const cards = list.map(function(item) {
            const t = item && item.title ? item.title : "—";
            const lnk = item && item.link ? link(item.link, "LinkedIn") : "";
            return (
              '<div class="gc-card">' +
                '<p class="gc-item-title">' + esc(t) + '</p>' +
                '<p>' + lnk + '</p>' +
              '</div>'
            );
          }).join("");
          return '<div class="gc-grid">' + cards + '</div>';
        }

        function renderTemplate(d) {
          const errors = [];
          if (!d || typeof d !== "object") errors.push("Empty or invalid JSON.");
          if (!d.company) errors.push("Missing: company");
          if (!d.company_website) errors.push("Missing: company_website");
          if (!Array.isArray(d.hr)) errors.push("Missing or invalid: hr[]");
          if (!Array.isArray(d.potential_leads)) errors.push("Missing or invalid: potential_leads[]");

          let out = "";
          if (errors.length) {
            out += '<div class="gc-error"><strong>Render error:</strong> ' + errors.join(" · ") + '</div>';
          }

          out += (
            '<div class="gc-header">' +
              '<h1 class="gc-title">' + esc(d.company || "") + '</h1>' +
              '<div class="gc-sub">Website: ' + link(d.company_website, "Link") + '</div>' +
            '</div>'
          );

          out += section("Company HR people", renderCards(d.hr));
          out += section("Potential leads", renderCards(d.potential_leads));
          return out;
        }
      })();
    </script>
  </body>
</html>
